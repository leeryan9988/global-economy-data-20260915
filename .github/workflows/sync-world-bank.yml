name: Sync World Bank data

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-world-bank.ts"
      - "scripts/postgres-ssl.ts"
      - "certs/**"
      - ".github/workflows/sync-world-bank.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 2 1 * *"

permissions:
  contents: read

concurrency:
  group: world-bank-production-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/certs/supabase-prod-ca-2021.crt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check database secret
        id: database
        shell: bash
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL is not configured; sync skipped."
          fi
      - name: Check production readiness
        if: steps.database.outputs.configured == 'true'
        run: pnpm readiness:production
      - name: Sync World Bank to PostgreSQL
        if: steps.database.outputs.configured == 'true'
        run: pnpm sync:world-bank
